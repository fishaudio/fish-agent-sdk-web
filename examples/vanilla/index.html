<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fish Agent SDK — vanilla example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; align-items: center; }
      .chip { padding: 0.15rem 0.6rem; border: 1px solid #ccc; border-radius: 999px; font-size: 0.85rem; }
      #transcript { border: 1px solid #e3e3e3; border-radius: 8px; padding: 0.5rem 0.75rem; min-height: 10rem; max-height: 24rem; overflow-y: auto; }
      #transcript p { margin: 0.35rem 0; }
      #transcript p.user { color: #1f52b8; }
      #error { color: #b3261e; min-height: 1.2rem; margin: 0.5rem 0; }
      button { padding: 0.3rem 0.8rem; }
      input[type="text"] { flex: 1; padding: 0.3rem 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Fish Agent SDK</h1>
    <div class="row">
      <input id="agent-id" type="text" placeholder="Agent id (public access enabled)" />
    </div>
    <div class="row">
      <button id="start">Start voice</button>
      <button id="end" disabled>End</button>
      <button id="mute" disabled>Mute</button>
      <span class="chip">status: <b id="status">idle</b></span>
    </div>
    <p id="error"></p>
    <div id="transcript"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
